<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}EpiTEC{% endblock %}</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            color: #1f2937;
        }

        header {
            background: white;
            border-bottom: 1px solid #e5e7eb;
            padding: 14px 30px;

            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .brand {
            font-size: 24px;
            font-weight: bold;
            color: #245b86;
        }

        .subtitle {
            font-size: 12px;
            color: #6b7280;
        }

        .user-info {
            text-align: right;
        }

        .user-email {
            font-weight: bold;
        }

        .user-role {
            font-size: 13px;
            color: #6b7280;
        }

        main {
            max-width: 1200px;
            margin: 30px auto;
            padding: 0 20px;
        }

        .card {
            background: white;
            border-radius: 10px;
            padding: 24px;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
        }

        .btn-primary {
            background: #245b86;
            color: white;
            border: none;
            border-radius: 6px;
            padding: 11px 18px;
            cursor: pointer;
            font-size: 14px;
        }

        .btn-secondary {
            background: white;
            color: #245b86;
            border: 1px solid #245b86;
            border-radius: 6px;
            padding: 10px 18px;
            cursor: pointer;
        }

        .logout-form {
            margin: 0;
        }
    </style>

    {% block extra_css %}
    {% endblock %}
</head>

<body>

<header>

    <div>
        <div class="brand">EpiTEC</div>
        <div class="subtitle">
            Surveillance épidémiologique
        </div>
    </div>

    {% if request.user.is_authenticated %}
    <div class="user-info">

        <div class="user-email">
            {{ request.user.email }}
        </div>

        <div class="user-role">
            {{ request.user.get_role_display }}
        </div>

        <form
            method="post"
            action="{% url 'logout' %}"
            class="logout-form"
        >
            {% csrf_token %}

            <button
                type="submit"
                class="btn-secondary"
            >
                Se déconnecter
            </button>
        </form>

    </div>
    {% endif %}

</header>

<main>

    {% block content %}
    {% endblock %}

</main>

</body>
</html>
